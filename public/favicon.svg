<svg viewBox="0 0 360 360" width="360" height="360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d5bdc" />
      <stop offset="55%" stop-color="#1743b8" />
      <stop offset="100%" stop-color="#0f3090" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ee1d2d" />
      <stop offset="100%" stop-color="#cc101e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Blue Rounded Square -->
  <rect x="42" y="26" width="276" height="308" rx="58" ry="58" fill="url(#blueGrad)" />

  <!-- Overhanging Red Banner -->
  <rect x="12" y="60" width="336" height="146" rx="32" ry="32" fill="url(#redGrad)" filter="url(#shadow)" />

  <!-- "JUBA" -->
  <text x="180" y="166" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" letter-spacing="4">JUBA</text>

  <!-- "NEWS" -->
  <text x="180" y="272" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="60" letter-spacing="8">NEWS</text>
</svg>
